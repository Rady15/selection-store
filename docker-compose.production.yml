services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://selection:${POSTGRES_PASSWORD}@db:5432/selection
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - selection_uploads:/app/public/uploads

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selection
      POSTGRES_USER: selection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - selection_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selection -d selection"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  selection_pgdata:
  selection_uploads:
